<script>
// Portal bridge: ?figure=<fid> -> auto-load the crop AND the batch
// digitization state (curves + axis calibration) into StarryDigitizer.
(async () => {
  const fid = new URLSearchParams(location.search).get('figure');
  if (!fid) return;
  try {
    const blob = await (await fetch('/ui/review/figure/' + fid + '.png')).blob();
    const file = new File([blob], 'figure-' + fid + '.png', {type: 'image/png'});
    const inject = () => {
      const all = [...document.querySelectorAll('input[type=file]')];
      const inp = all.find(i => (i.accept||'').includes('image'))
               || all.find(i => !(i.accept||'').includes('zip'))
               || all[1] || all[0];
      if (!inp) return setTimeout(inject, 300);
      const dt = new DataTransfer();
      dt.items.add(file);
      inp.files = dt.files;
      inp.dispatchEvent(new Event('change', {bubbles: true}));
      loadState();
    };
    const loadState = async () => {
      if (!window.__SD_BRIDGE) return setTimeout(loadState, 300);
      const state = await (await fetch('/ui/review/figure/' + fid + '/state')).json();
      setTimeout(() => window.__SD_BRIDGE.loadState(state), 800);
    };
    inject();
  } catch (e) { console.warn('portal bridge:', e); }
})();
</script>
